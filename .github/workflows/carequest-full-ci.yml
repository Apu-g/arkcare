name: CareQuest Full Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: carequest-full-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Frontend install and build
        working-directory: Frontend
        env:
          NEXT_PUBLIC_CAREQUEST_TEST_BOOKING_BYPASS: "true"
        run: |
          npm ci
          npm run build

      - name: Timezone and DST invariants
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { localDateTimeToUtc } from "./Frontend/lib/carequest/time.mjs";
          const india = localDateTimeToUtc(
            { year: 2026, month: 9, day: 28 },
            "09:00",
            "Asia/Kolkata"
          ).toISOString();
          if (india !== "2026-09-28T03:30:00.000Z") {
            throw new Error("India timezone conversion failed: " + india);
          }
          const nyAfterDst = localDateTimeToUtc(
            { year: 2026, month: 3, day: 9 },
            "09:00",
            "America/New_York"
          ).toISOString();
          if (nyAfterDst !== "2026-03-09T13:00:00.000Z") {
            throw new Error("DST conversion failed: " + nyAfterDst);
          }
          console.log("CareQuest timezone/DST invariants PASS");
          NODE

      - name: Backend syntax
        shell: bash
        run: |
          if command -v python >/dev/null 2>&1; then
            python -m py_compile Backend/chatbotwithpdf.py
          else
            python3 -m py_compile Backend/chatbotwithpdf.py
          fi

      - name: Demo seed script syntax
        shell: bash
        run: node --check Frontend/scripts/seed-carequest-demo.mjs


      - name: Install local blockchain dependencies
        working-directory: Blockchain
        run: npm install

      - name: Local blockchain smoke
        shell: bash
        working-directory: Blockchain
        env:
          CAREQUEST_EVM_RPC_URL: http://127.0.0.1:18545
          CAREQUEST_BLOCKCHAIN_BRIDGE_PORT: "18546"
        run: |
          rm -rf runtime
          mkdir -p runtime
          npx hardhat node --hostname 127.0.0.1 --port 18545 > runtime/hardhat-ci.log 2>&1 &
          EVM_PID=$!
          BRIDGE_PID=""
          trap 'kill $EVM_PID $BRIDGE_PID 2>/dev/null || true' EXIT

          node - <<'NODE'
          const url = process.env.CAREQUEST_EVM_RPC_URL;
          for (let i = 0; i < 60; i++) {
            try {
              const r = await fetch(url, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_chainId",params:[]})});
              if (r.ok) process.exit(0);
            } catch {}
            await new Promise(r => setTimeout(r, 500));
          }
          process.exit(1);
          NODE

          node scripts/deploy.js
          node bridge-server.js > runtime/bridge-ci.log 2>&1 &
          BRIDGE_PID=$!

          node - <<'NODE'
          const url = "http://127.0.0.1:" + process.env.CAREQUEST_BLOCKCHAIN_BRIDGE_PORT + "/health";
          for (let i = 0; i < 60; i++) {
            try {
              const r = await fetch(url);
              if (r.ok) process.exit(0);
            } catch {}
            await new Promise(r => setTimeout(r, 500));
          }
          process.exit(1);
          NODE

          BRIDGE="http://127.0.0.1:${CAREQUEST_BLOCKCHAIN_BRIDGE_PORT}"
          HEALTH=$(curl -fsS "$BRIDGE/health")
          echo "$HEALTH" | grep '"hospitalCapsuleAddress"'
          WALLET=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"reference":"ci-patient"}' "$BRIDGE/wallet" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).walletAddress))')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"walletAddress\":\"$WALLET\",\"amount\":2,\"reference\":\"ci-award\"}" "$BRIDGE/mint"
          curl -fsS "$BRIDGE/balance?walletAddress=$WALLET" | grep '"balance":2'
          node scripts/smoke.js


      - name: Install browser test dependency
        working-directory: Frontend
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: CareQuest integrated browser E2E
        env:
          CAREQUEST_E2E_BASE_URL: http://127.0.0.1:13001
          NEXT_PUBLIC_CAREQUEST_TEST_BOOKING_BYPASS: "true"
          CAREQUEST_TEST_BOOKING_BYPASS: "true"
        run: node Frontend/tests/carequest-e2e.cjs
